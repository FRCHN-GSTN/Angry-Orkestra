name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selfcheck:
    name: bash test.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run self-check
        run: bash test.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint sync.sh
        run: shellcheck --severity=warning sync.sh
      - name: Lint test.sh
        run: shellcheck --severity=warning test.sh
